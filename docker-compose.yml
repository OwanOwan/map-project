services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safetymap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-safetymap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safetymap}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safetymap-network

  redis:
    image: redis:7-alpine
    container_name: safetymap-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safetymap-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  safetymap-network:
    driver: bridge
