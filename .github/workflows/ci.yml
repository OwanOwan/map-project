name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: safetymap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check

      - name: Build packages and apps
        run: pnpm build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetymap
        run: pnpm db:migrate

      - name: Seed Database
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetymap
        run: pnpm db:seed

      - name: Run Verification Spatial Query (2 km radius)
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetymap
        run: pnpm db:query-nearby

      - name: Run API Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetymap
          REDIS_URL: redis://localhost:6379
          PORT: 3001
        run: pnpm test
